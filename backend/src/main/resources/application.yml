spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: homepal-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
security:
  jwt:
    access-token-validity-minutes: 15
    refresh-token-validity-days: 14
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://10.0.2.2:19006}
  rate-limit:
    auth: 5
    search: 60
sarvam:
  api-key: ${SARVAM_API_KEY:}
  model: ${SARVAM_MODEL:sarvam-m}
nutrition:
  datasets:
    processed: ${NUTRITION_PROCESSED_DATASET:../Indian_Food_Nutrition_Processed.csv}
    fruits: ${NUTRITION_FRUITS_DATASET:../Indian Fruits And Nutritious Foods Dataset.csv}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
